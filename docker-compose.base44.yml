services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sindh_academy
      POSTGRES_USER: academy
      POSTGRES_PASSWORD: academy_dev_pass_2024
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academy -d sindh_academy"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: node:22
    working_dir: /app/backend
    volumes:
      - ./:/app
      - /app/backend/node_modules
      - backend_uploads:/app/backend/uploads
    environment:
      - DATABASE_URL=postgresql://academy:academy_dev_pass_2024@db:5432/sindh_academy
      - PORT=8000
      - NODE_ENV=development
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm install && node --watch src/server.js"

  frontend:
    image: node:22
    working_dir: /app/frontend
    volumes:
      - ./:/app
      - /app/frontend/node_modules
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=/api
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    depends_on:
      - backend
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 3000"

volumes:
  pgdata:
  backend_uploads:
